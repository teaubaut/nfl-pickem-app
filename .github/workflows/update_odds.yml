name: Update odds and picks

on:
  schedule:
    - cron: "0 13 * * 4"   # Thursdays 13:00 UTC = 8 AM CDT / 7 AM CST
    - cron: "0 15 * * 4"   # Thursdays 15:00 UTC = 10 AM CDT / 9 AM CST (backup)
    - cron: "0 13 * * 0"   # Sundays 13:00 UTC (before the early Sunday games)
  workflow_dispatch:        # Run manually: Actions tab > Update odds and picks > Run workflow
    inputs:
      week:
        description: "NFL week to fetch (leave blank for the current week)"
        required: false
        default: ""
      debug_public:
        description: "Show Action Network diagnostics in the run summary"
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # commit data.json back to the repo
  pages: write      # request a Pages rebuild after pushing

concurrency:
  group: update-odds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Warn if the Odds API key is missing
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY secret is not set. Picks will use Kalshi prices only."
          fi

      - name: Run fetch_data.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WEEK: ${{ github.event.inputs.week }}
          DEBUG_PUBLIC: ${{ github.event.inputs.debug_public }}
        run: |
          ARGS=(--output data.json)
          if [ -n "$WEEK" ]; then
            ARGS+=(--week "$WEEK")
          fi
          if [ "$DEBUG_PUBLIC" = "true" ]; then
            ARGS+=(--debug-public)
          fi
          python fetch_data.py "${ARGS[@]}"

      - name: Commit and push data.json if it changed
        id: commit
        run: |
          if git diff --quiet -- data.json && git ls-files --error-unmatch data.json >/dev/null 2>&1; then
            echo "data.json unchanged; nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WEEK_NUM=$(python -c "import json; print(json.load(open('data.json')).get('week') or '?')")
          STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update week ${WEEK_NUM} odds and picks (${STAMP})"

          # Retry in case something else was pushed while this job ran.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done

          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Request a GitHub Pages rebuild
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent

      - name: Summary
        if: always()
        run: |
          if [ -f data.json ]; then
            python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open("data.json"))
          print(f"### Week {d.get('week')} picks\n")
          def fmt(x):
              return f"{x:.0%}" if isinstance(x, (int, float)) else "n/a"
          print("| Game | Pick | Win % | Public | Flags |")
          print("|---|---|---|---|---|")
          for p in d.get("summary", {}).get("picks", []):
              flags = [name for key, name in (("live_upset_candidate", "Upset"),
                                               ("high_leverage_play", "Leverage"),
                                               ("high_leverage_underdog", "Contrarian dog")) if p.get(key)]
              print(f"| {p.get('matchup')} | {p.get('pick') or '-'} | {fmt(p.get('win_probability'))} "
                    f"| {fmt(p.get('public_pick_pct'))} | {', '.join(flags)} |")
          for m in d.get("monday_night_football", []):
              if m.get("projection_available"):
                  pr = m["projected"]
                  print(f"\n**MNF tiebreaker:** {m['favorite']} {pr['favorite']} - {m['underdog']} {pr['underdog']}, total {m['projected_total']}")
          PY
          fi
          if [ -f public_debug.json ]; then
            python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open("public_debug.json"))
          print("\n### Action Network diagnostics\n")
          print(f"Game dates queried: {', '.join(d.get('game_dates') or []) or 'none'}\n")
          print("| Endpoint | Date | Games | With splits | Result |")
          print("|---|---|---|---|---|")
          for r in d.get("requests", []):
              result = r.get("error") or ", ".join(r.get("matchups") or []) or "no games"
              print(f"| {r.get('endpoint')} | {r.get('date')} | {r.get('games', '-')} | {r.get('with_splits', '-')} | {result} |")
          for r in d.get("requests", []):
              if r.get("games"):
                  print(f"\n**Sample game fields ({r['endpoint']}, {r['date']}):**\n")
                  print("```")
                  print("game keys: " + ", ".join(r.get("game_keys") or []))
                  for line in r.get("split_like_fields") or ["(no split-like fields found)"]:
                      print(line)
                  print("```")
                  break
          PY
          fi
